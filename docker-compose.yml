services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmanager-web
    working_dir: /app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,[::1]"
    volumes:
      - ./vmanager:/app
